<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D0B" />
      <stop offset="100%" stop-color="#0D1A16" />
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D98B4E" />
      <stop offset="100%" stop-color="#F2C14E" />
    </linearGradient>
    <pattern id="pcb" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#D98B4E" opacity="0.15" />
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" stroke="#EFE8D8" stroke-width="0.5" opacity="0.04" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#pcb)" />
  
  <!-- Circuit Traces -->
  <path d="M 50 100 L 200 100 L 250 150 L 550 150 L 600 200 L 750 200" stroke="#D98B4E" stroke-width="2" fill="none" opacity="0.4" />
  <circle cx="200" cy="100" r="4" fill="#F2C14E" />
  <circle cx="550" cy="150" r="4" fill="#5BC8A8" />
  
  <!-- Main Card Graphic -->
  <rect x="80" y="60" width="640" height="330" rx="12" fill="#0D1A16" stroke="#D98B4E" stroke-width="1.5" opacity="0.95" />
  
  <!-- Header Bar -->
  <rect x="80" y="60" width="640" height="48" rx="12" fill="#14261F" />
  <circle cx="110" cy="84" r="6" fill="#D98B4E" />
  <circle cx="130" cy="84" r="6" fill="#5BC8A8" />
  <circle cx="150" cy="84" r="6" fill="#F2C14E" />
  <text x="400" y="90" fill="#8E9C93" font-family="monospace" font-size="13" text-anchor="middle">groomyindia.com — High-Throughput Booking Architecture</text>
  
  <!-- Content Graphic -->
  <rect x="120" y="140" width="260" height="180" rx="8" fill="#060D0B" stroke="rgba(217,139,78,0.3)" stroke-width="1" />
  <text x="140" y="180" fill="#F2C14E" font-family="monospace" font-size="12">[ REDIS CACHING LAYER ]</text>
  <text x="140" y="210" fill="#EFE8D8" font-family="sans-serif" font-weight="bold" font-size="18">80%+ Query Bypass</text>
  <text x="140" y="240" fill="#5BC8A8" font-family="monospace" font-size="13">P99 Latency: 1.8ms</text>
  <text x="140" y="270" fill="#8E9C93" font-family="monospace" font-size="12">Active Partners: Real-time</text>
  <text x="140" y="295" fill="#D98B4E" font-family="monospace" font-size="12">Auto-dispatch: Geo-clustered</text>
  
  <!-- Flow lines to right side -->
  <path d="M 380 230 L 440 230" stroke="#F2C14E" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="440" cy="230" r="4" fill="#F2C14E" />

  <rect x="440" y="140" width="240" height="180" rx="8" fill="#14261F" stroke="rgba(91,200,168,0.3)" stroke-width="1" />
  <text x="460" y="180" fill="#5BC8A8" font-family="monospace" font-size="12">[ CORE API GATEWAY ]</text>
  <text x="460" y="210" fill="#EFE8D8" font-family="sans-serif" font-weight="bold" font-size="18">Groomy India</text>
  <text x="460" y="240" fill="#8E9C93" font-family="sans-serif" font-size="13">On-Demand Home Salon</text>
  <rect x="460" y="260" width="100" height="24" rx="4" fill="#D98B4E" />
  <text x="510" y="276" fill="#060D0B" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">FLAGSHIP</text>
  
  <rect x="570" y="260" width="90" height="24" rx="4" fill="#060D0B" stroke="#5BC8A8" stroke-width="1" />
  <text x="615" y="276" fill="#5BC8A8" font-family="monospace" font-size="11" text-anchor="middle">JWT AUTH</text>
</svg>
